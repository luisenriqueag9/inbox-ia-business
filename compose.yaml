# compose.yaml — Inbox IA Business
# Uso: exclusivamente para desarrollo local.
# Este archivo no debe usarse en produccion sin revision de seguridad adicional.
#
# Requisito: copiar .env.example a .env y completar los valores antes de ejecutar.

services:
  db:
    image: postgres:16.9
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: inbox_ia_postgres_data
